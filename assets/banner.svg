<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" />

  <!-- Animated Grid / Network Elements -->
  <g opacity="0.15">
    <circle cx="150" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="220" r="5" fill="#818cf8">
      <animate attributeName="r" values="4;8;4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="70" r="6" fill="#c084fc">
      <animate attributeName="r" values="4;7;4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="210" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="150" y1="80" x2="300" y2="220" stroke="#38bdf8" stroke-width="1" />
    <line x1="950" y1="70" x2="1050" y2="210" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Main Title & Subtitle -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="600" y="115" font-size="42" font-weight="900" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
      PROSPECTING AUTOMATION PLATFORMS
    </text>
    
    <text x="600" y="165" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="3" opacity="0.9">
      SAAS ECOSYSTEM &amp; OPEN-SOURCE OUTBOUND TOOLS
    </text>

    <!-- Pulsing Badges inside Banner -->
    <g transform="translate(600, 225)">
      <rect x="-240" y="-20" width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="-165" y="3" font-size="13" font-weight="700" fill="#38bdf8">⚡ AI SDRs</text>

      <rect x="-75" y="-20" width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="0" y="3" font-size="13" font-weight="700" fill="#818cf8">📧 Cold Email</text>

      <rect x="90" y="-20" width="150" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <text x="165" y="3" font-size="13" font-weight="700" fill="#c084fc">🔍 Enrichment</text>
    </g>
  </g>
</svg>
